name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Retry an existing annotated vX.Y.Z release tag"
        required: true
        type: string

# Cancel in-progress runs when a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Validate and prepare release
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      commit: ${{ steps.tag.outputs.commit }}
      tag_oid: ${{ steps.tag.outputs.tag_oid }}

    steps:
      - name: Determine release version
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            push)
              if [ "$GITHUB_REF_TYPE" != "tag" ]; then
                echo "Error: release pushes must target a version tag"
                exit 1
              fi
              VERSION="$GITHUB_REF_NAME"
              ;;
            workflow_dispatch)
              if [ "$GITHUB_REF_TYPE" != "branch" ] || [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
                echo "Error: manual release retries must run from the default branch (${DEFAULT_BRANCH})"
                exit 1
              fi
              VERSION="$DISPATCH_VERSION"
              ;;
            *)
              echo "Error: releases must be triggered by a pushed tag or manual retry"
              exit 1
              ;;
          esac

          SEMVER_PATTERN='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [ "${#VERSION}" -gt 128 ] || [[ ! "$VERSION" =~ $SEMVER_PATTERN ]]; then
            echo "Error: release version must be valid v-prefixed SemVer"
            exit 1
          fi

          VERSION_WITHOUT_BUILD="${VERSION%%+*}"
          if [[ "$VERSION_WITHOUT_BUILD" == *-* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.version.outputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        id: tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERIFIED_TAG_REF="refs/release-tags/${VERSION}"
          git fetch --no-tags --force origin "refs/tags/${VERSION}:${VERIFIED_TAG_REF}"

          if ! git cat-file -e "${VERIFIED_TAG_REF}^{tag}" 2>/dev/null; then
            echo "Error: ${VERSION} must be an annotated tag"
            exit 1
          fi

          TAG_OID="$(git rev-parse "${VERIFIED_TAG_REF}")"
          TAG_NAME="$(git cat-file -p "${VERIFIED_TAG_REF}" | sed -n 's/^tag //p' | head -1)"
          TAG_TARGET_TYPE="$(git cat-file -p "${VERIFIED_TAG_REF}" | sed -n 's/^type //p' | head -1)"
          if [ "$TAG_NAME" != "$VERSION" ] || [ "$TAG_TARGET_TYPE" != "commit" ]; then
            echo "Error: ${VERSION} must be an annotated tag with a matching name and commit target"
            exit 1
          fi

          TAG_COMMIT="$(git rev-parse "${VERIFIED_TAG_REF}^{commit}")"
          CHECKOUT_COMMIT="$(git rev-parse "HEAD^{commit}")"
          if [ "$TAG_COMMIT" != "$CHECKOUT_COMMIT" ]; then
            echo "Error: release tag and checkout do not resolve to the same commit"
            exit 1
          fi

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            EVENT_COMMIT="$(git rev-parse "${GITHUB_SHA}^{commit}")"
            if [ "$TAG_COMMIT" != "$EVENT_COMMIT" ]; then
              echo "Error: release tag and workflow event do not resolve to the same commit"
              exit 1
            fi
          fi

          git fetch --no-tags --force origin "refs/heads/master:refs/remotes/origin/master"
          if ! git merge-base --is-ancestor "$TAG_COMMIT" refs/remotes/origin/master; then
            echo "Error: release tag commit must be reachable from origin/master"
            exit 1
          fi

          echo "commit=${TAG_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "tag_oid=${TAG_OID}" >> "$GITHUB_OUTPUT"

      - name: Verify package versions
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_NUM="${VERSION#v}"
          METADATA="$(cargo metadata --locked --format-version 1)"
          SDK_VERSION="$(jq -er '.packages[] | select(.name == "neo3") | .version' <<< "$METADATA")"
          SDK_ID="$(jq -er '.packages[] | select(.name == "neo3") | .id' <<< "$METADATA")"
          CLI_VERSION="$(jq -er '.packages[] | select(.name == "neo-cli") | .version' <<< "$METADATA")"
          CLI_ID="$(jq -er '.packages[] | select(.name == "neo-cli") | .id' <<< "$METADATA")"
          CLI_SDK_REQUIREMENT="$(jq -er '.packages[] | select(.name == "neo-cli") | .dependencies[] | select(.name == "neo3") | .req' <<< "$METADATA")"
          RESOLVED_CLI_SDK_ID="$(jq -er --arg cli_id "$CLI_ID" '.resolve.nodes[] | select(.id == $cli_id) | .deps[] | select(.name == "neo3") | .pkg' <<< "$METADATA")"

          if [ "$VERSION_NUM" != "$SDK_VERSION" ]; then
            echo "Error: tag version ($VERSION_NUM) doesn't match neo3 ($SDK_VERSION)"
            exit 1
          fi
          if [ "$VERSION_NUM" != "$CLI_VERSION" ]; then
            echo "Error: tag version ($VERSION_NUM) doesn't match neo-cli ($CLI_VERSION)"
            exit 1
          fi
          if [ "$CLI_SDK_REQUIREMENT" != "^${SDK_VERSION}" ]; then
            echo "Error: neo-cli must declare neo3 ${SDK_VERSION} as its compatibility floor"
            exit 1
          fi
          if [ "$RESOLVED_CLI_SDK_ID" != "$SDK_ID" ]; then
            echo "Error: neo-cli's neo3 dependency does not resolve to the workspace SDK"
            exit 1
          fi

          LOCK_NEO3_VERSION="$(awk '/^name = "neo3"$/ { getline; gsub(/"/, "", $3); print $3; exit }' Cargo.lock)"
          LOCK_CLI_VERSION="$(awk '/^name = "neo-cli"$/ { getline; gsub(/"/, "", $3); print $3; exit }' Cargo.lock)"
          if [ "$LOCK_NEO3_VERSION" != "$SDK_VERSION" ]; then
            echo "Error: Cargo.lock neo3 version ($LOCK_NEO3_VERSION) doesn't match manifest ($SDK_VERSION)"
            exit 1
          fi
          if [ "$LOCK_CLI_VERSION" != "$CLI_VERSION" ]; then
            echo "Error: Cargo.lock neo-cli version ($LOCK_CLI_VERSION) doesn't match manifest ($CLI_VERSION)"
            exit 1
          fi

          if ! grep -q "^## \[${VERSION_NUM}\] - " CHANGELOG.md; then
            echo "Error: CHANGELOG.md has no dated ${VERSION_NUM} release section"
            exit 1
          fi

      - name: Verify locked workspace metadata
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null

  verify:
    name: Verify Release Candidate
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --locked --all-features --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Build API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p neo3 --locked --all-features --no-deps

      - name: Audit dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check supply-chain policy
        uses: EmbarkStudios/cargo-deny-action@v2

  # Build release artifacts
  build:
    name: Build - ${{ matrix.os }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: neorust-linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: neorust-windows-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: neorust-macos-amd64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p neo-cli --bin neo-cli

      - name: Package artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          BINARY="target/${{ matrix.target }}/release/neo-cli"
          if [ ! -f "$BINARY" ]; then
            echo "Error: release binary not found at ${BINARY}"
            exit 1
          fi

          mkdir -p dist
          cp "$BINARY" dist/
          cp README.md LICENSE CHANGELOG.md dist/
          tar -czf ${{ matrix.artifact }}.tar.gz -C dist .

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Binary = "target\${{ matrix.target }}\release\neo-cli.exe"
          if (-not (Test-Path $Binary)) {
            throw "Release binary not found at $Binary"
          }

          New-Item -ItemType Directory -Force -Path dist
          Copy-Item $Binary dist\
          Copy-Item README.md, LICENSE, CHANGELOG.md dist\
          Compress-Archive -Path dist\* -DestinationPath ${{ matrix.artifact }}.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error

  # Create GitHub release
  release:
    name: Create GitHub Release
    needs: [prepare, build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Extract release notes
        id: release-notes
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          VERSION_NUM="${VERSION#v}"

          # Extract release notes from CHANGELOG.md
          awk "/## \[${VERSION_NUM}\]/{flag=1; next} /## \[/{flag=0} flag" CHANGELOG.md > release-notes.md

          # If no specific notes found, use a default message
          if [ ! -s release-notes.md ]; then
            echo "Release ${VERSION}" > release-notes.md
            echo "" >> release-notes.md
            echo "See [CHANGELOG.md](CHANGELOG.md) for details." >> release-notes.md
          fi

          echo "Release notes:"
          cat release-notes.md

      - name: Revalidate remote tag
        env:
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
          EXPECTED_TAG_OID: ${{ needs.prepare.outputs.tag_oid }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          VERIFIED_TAG_REF="refs/release-tags/${VERSION}"
          git fetch --no-tags --force origin "refs/tags/${VERSION}:${VERIFIED_TAG_REF}"

          TAG_OID="$(git rev-parse "${VERIFIED_TAG_REF}")"
          TAG_COMMIT="$(git rev-parse "${VERIFIED_TAG_REF}^{commit}")"
          if [ "$TAG_OID" != "$EXPECTED_TAG_OID" ] || [ "$TAG_COMMIT" != "$EXPECTED_COMMIT" ]; then
            echo "Error: ${VERSION} changed after release preparation"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: NeoRust ${{ needs.prepare.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
          token: ${{ secrets.GITHUB_TOKEN }}

  # Publish crate
  publish:
    name: Publish neo3 crate
    needs: [prepare, build, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check crates.io publication
        id: crates
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          VERSION_NUM="${VERSION#v}"
          RESPONSE_FILE="${RUNNER_TEMP}/neo3-${VERSION_NUM}.json"

          STATUS="$(
            curl --silent --show-error --location \
              --user-agent "neo-rust-sdk-release/${VERSION_NUM}" \
              --header "Accept: application/json" \
              --connect-timeout 15 \
              --max-time 60 \
              --retry 3 \
              --retry-all-errors \
              --retry-delay 2 \
              --output "$RESPONSE_FILE" \
              --write-out "%{http_code}" \
              "https://crates.io/api/v1/crates/neo3/${VERSION_NUM}"
          )" || {
            echo "Error: unable to determine whether neo3 ${VERSION_NUM} is published."
            exit 1
          }

          case "$STATUS" in
            200)
              if ! jq -e --arg version "$VERSION_NUM" '.version.num == $version' "$RESPONSE_FILE" > /dev/null; then
                echo "Error: crates.io returned unexpected metadata for neo3 ${VERSION_NUM}."
                cat "$RESPONSE_FILE"
                exit 1
              fi
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "neo3 ${VERSION_NUM} is already published on crates.io."
              ;;
            404)
              echo "published=false" >> "$GITHUB_OUTPUT"
              echo "neo3 ${VERSION_NUM} is not published on crates.io."
              ;;
            *)
              echo "Error: Unexpected crates.io response ${STATUS}; refusing to publish blindly."
              cat "$RESPONSE_FILE"
              exit 1
              ;;
          esac

      - name: Require crates.io token
        if: steps.crates.outputs.published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN || secrets.CRATES_IO_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_TOKEN or CRATES_IO_TOKEN must be configured to publish this release."
            exit 1
          fi

      - name: Verify package
        if: steps.crates.outputs.published != 'true'
        run: cargo publish --dry-run --locked -p neo3

      - name: Revalidate remote tag
        if: steps.crates.outputs.published != 'true'
        env:
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
          EXPECTED_TAG_OID: ${{ needs.prepare.outputs.tag_oid }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          VERIFIED_TAG_REF="refs/release-tags/${VERSION}"
          git fetch --no-tags --force origin "refs/tags/${VERSION}:${VERIFIED_TAG_REF}"

          TAG_OID="$(git rev-parse "${VERIFIED_TAG_REF}")"
          TAG_COMMIT="$(git rev-parse "${VERIFIED_TAG_REF}^{commit}")"
          if [ "$TAG_OID" != "$EXPECTED_TAG_OID" ] || [ "$TAG_COMMIT" != "$EXPECTED_COMMIT" ]; then
            echo "Error: ${VERSION} changed after release preparation"
            exit 1
          fi

      - name: Publish to crates.io
        if: steps.crates.outputs.published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN || secrets.CRATES_IO_TOKEN }}
        run: cargo publish --locked -p neo3

      - name: Skip already published crate
        if: steps.crates.outputs.published == 'true'
        run: |
          echo "neo3 ${{ needs.prepare.outputs.version }} is already published; skipping crates.io publish."
