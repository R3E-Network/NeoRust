name: Fuzz Testing

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'tests/fuzz/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/fuzz-test.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: fuzz-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  fuzz-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug/.proptest
          key: ${{ runner.os }}-proptest-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-proptest-
            
      - name: Run script parser proptest
        run: cargo test --locked --test script_parser_fuzz --release
        
      - name: Run cryptographic proptest
        run: cargo test --locked --test cryptographic_fuzz --release
        
      - name: Run RPC response proptest
        run: cargo test --locked --test rpc_response_fuzz --release
        
      - name: Summarize fuzz run
        run: |
          echo "All registered proptest fuzz targets passed." >> "$GITHUB_STEP_SUMMARY"
          
      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            tests/fuzz/**/*.proptest-regressions
            proptest-regressions/**
          if-no-files-found: ignore

  regression-check:
    runs-on: ubuntu-latest
    needs: fuzz-test
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Run property-based tests
        run: cargo test --locked --all-features --lib
        
      - name: Check for panics in edge cases
        run: |
          cargo test --locked --release \
            --test script_parser_fuzz \
            --test cryptographic_fuzz \
            --test rpc_response_fuzz \
            2>&1 | tee panic-report.txt
        
      - name: Alert on critical findings
        if: failure()
        run: |
          echo "⚠️ CRITICAL: Fuzz testing detected potential vulnerabilities!"
          echo "Please review the test output and fix any issues."
