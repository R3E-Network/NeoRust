name: Benchmarks
# Statistical performance benchmarking with regression detection.
#
# Establishes a per-commit performance baseline using Criterion, then compares
# the current revision against the previous commit / PR base. A benchmark that
# regresses by more than the configured threshold (default 5%) fails the job.
#
# Local usage mirrors CI; select Criterion targets explicitly whenever passing
# Criterion-specific arguments so Cargo's built-in library harness is excluded.
# See docs/BENCHMARKING.md for the full guide.

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      regression_threshold:
        description: "Max allowed slowdown (percent) before the gate fails"
        required: false
        default: "5"

concurrency:
  group: bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Keep benchmark builds reproducible and comparable across the two runs.
  CARGO_INCREMENTAL: 0
  # Default regression gate: fail if any benchmark is >5% slower than baseline.
  REGRESSION_THRESHOLD: ${{ github.event.inputs.regression_threshold || '5' }}

jobs:
  benchmark:
    name: Criterion Benchmarks & Regression Gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (full history for base comparison)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-bench-

      - name: Determine baseline commit
        id: baseline
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            # push / manual: compare against the immediate parent commit
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "Baseline commit: $BASE_SHA"

      - name: Benchmark baseline (previous commit)
        shell: bash
        run: |
          set -euo pipefail
          BASELINE_WORKTREE="${RUNNER_TEMP}/neo-rust-sdk-benchmark-base"
          cleanup() {
            git worktree remove --force "$BASELINE_WORKTREE" 2>/dev/null || true
          }
          trap cleanup EXIT

          git worktree add --quiet --detach "$BASELINE_WORKTREE" "${{ steps.baseline.outputs.sha }}"
          rm -rf "${GITHUB_WORKSPACE}/target/criterion"

          cd "$BASELINE_WORKTREE"
          mapfile -t BENCH_TARGETS < <(
            cargo metadata --locked --no-deps --format-version 1 |
              jq -r '.packages[] | select(.name == "neo3") | .targets[] | select(.kind == ["bench"]) | .name'
          )
          if [ "${#BENCH_TARGETS[@]}" -eq 0 ]; then
            echo "Baseline commit has no registered Criterion targets; current results will be NEW."
            exit 0
          fi
          BENCH_ARGS=()
          for target in "${BENCH_TARGETS[@]}"; do
            BENCH_ARGS+=(--bench "$target")
          done
          CARGO_TARGET_DIR="${GITHUB_WORKSPACE}/target" \
            cargo bench --locked "${BENCH_ARGS[@]}" -- --save-baseline base --noplot

      - name: Benchmark current revision
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t BENCH_TARGETS < <(
            cargo metadata --locked --no-deps --format-version 1 |
              jq -r '.packages[] | select(.name == "neo3") | .targets[] | select(.kind == ["bench"]) | .name'
          )
          if [ "${#BENCH_TARGETS[@]}" -eq 0 ]; then
            echo "Error: current commit has no registered Criterion targets"
            exit 1
          fi
          BENCH_ARGS=()
          for target in "${BENCH_TARGETS[@]}"; do
            BENCH_ARGS+=(--bench "$target")
          done
          cargo bench --locked "${BENCH_ARGS[@]}" -- --save-baseline current --noplot

      - name: Regression gate (>${{ env.REGRESSION_THRESHOLD }}% = fail)
        run: |
          python3 scripts/check_bench_regression.py \
            --baseline base \
            --current current \
            --threshold "${REGRESSION_THRESHOLD}" \
            --criterion-dir target/criterion \
            --markdown "$GITHUB_STEP_SUMMARY"

      - name: Upload Criterion reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion-reports
          path: |
            target/criterion/**/report/**
            target/criterion/**/*/estimates.json
          if-no-files-found: ignore

  # Monthly scheduled trend report is handled by benchmark-trend.yml (cron).
  # This job intentionally stays PR/push focused for fast regression feedback.
