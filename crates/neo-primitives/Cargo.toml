[package]
name = "neo-primitives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Core primitive types for Neo N3 blockchain (no_std compatible)"
keywords = ["neo", "blockchain", "crypto", "no_std"]
categories = ["cryptography", "no-std"]

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
ripemd = { version = "0.1", default-features = false }
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "alloc"] }
thiserror = { version = "2.0", optional = true }

[features]
default = ["std"]
std = ["serde/std", "hex/std", "bs58/std", "sha2/std", "ripemd/std", "k256/std", "dep:thiserror"]

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "primitives"
harness = false
