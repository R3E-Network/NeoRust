[package]
name = "neo-protocol"
version = "4.0.0-alpha.1"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/r3e-network/neo-rust-sdk"
authors = ["R3E Network <jimmy@r3e.network>"]
description = "Neo N3 protocol types: transactions, blocks, witnesses (no_std compatible)"
keywords = ["neo", "blockchain", "transaction", "no_std"]
categories = ["cryptography", "no-std"]

[dependencies]
neo-primitives = { path = "../neo-primitives", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }

[features]
default = ["std"]
std = ["neo-primitives/std", "serde/std", "hex/std"]

[dev-dependencies]
serde_json = "1.0"

[lib]
name = "neo_protocol"
path = "src/lib.rs"
